name: Linters

on:
  push:
    branches:
      - version-16
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linters-student-management-system-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
